# Pushing a tag vX.Y.Z builds every platform and drafts a GitHub release with
# the packages and the update files that installed apps check once it is
# published. The tag must match "version" in mygo.json. Only updates are
# signed (MYGO_UPDATER_PRIVATE_KEY, from mygo keygen): macOS gets mygo's
# ad-hoc signature, Windows none.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Match the tag with mygo.json, and check the update key is there
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::the secret MYGO_UPDATER_PRIVATE_KEY is not set: releases without it cannot update"
            exit 1
          fi
          version=$(jq -r .version mygo.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in mygo.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile && bun run typecheck && bun run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: go run github.com/egoist/mygo/cmd/mygo build -platform darwin/universal -o build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - name: Collect the packages
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          mv "build/darwin-universal/Gotify Desktop $VERSION.dmg" "dist/Gotify-Desktop-$VERSION-macos-universal.dmg"
          # The manifest finds the archive and deltas by these names.
          mv build/darwin-universal/update-darwin-universal.json build/darwin-universal/*.tar.gz dist/
          mv build/darwin-universal/*.delta dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows-linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install NSIS for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: go run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64,windows/arm64,linux/amd64 -o build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - name: Collect the packages
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            mv "build/windows-$arch/Gotify Desktop Setup $VERSION.exe" "dist/Gotify-Desktop-$VERSION-windows-$arch-setup.exe"
          done
          # The manifests and install.sh find the archives and deltas by
          # their names: keep mygo's.
          for target in windows-amd64 windows-arm64 linux-amd64; do
            mv "build/$target/update-$target.json" build/"$target"/*.tar.gz dist/
            mv build/"$target"/*.delta dist/ 2>/dev/null || true
          done
          mv build/linux-amd64/*.deb build/linux-amd64/install.sh dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, macos, windows-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" *
